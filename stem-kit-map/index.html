<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ kit STEM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Bố cục: thanh bo chủ đứng bên trái như một dải mạch in, mỗi cổng kéo một sợi dây màu sang module. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e7edeb; --fg:#15201e; --muted:#5a6966; --line:#d3dbd8;
  --board:#0f4f49; --board-fg:#e6f4f1; --accent:#0d7a70; --accent-fg:#ffffff;
  --core:#0d7a70; --smart:#7a3fd1; --in:#1668b3; --out:#b4560c; --mech:#6b6259;
  --w-da:#7d8a87; --w-i2c:#2f6fe4; --w-spi:#b58a00; --w-sv:#3a4442; --w-pwr:#c9451a;
  --f-body:'Be Vietnam Pro',system-ui,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172220; --sunk:#1f2c2a; --fg:#e4eeeb; --muted:#93a5a1; --line:#2c3b38;
  --board:#14605a; --board-fg:#e6f4f1; --accent:#3cc2b3; --accent-fg:#06211e;
  --core:#3cc2b3; --smart:#b28cf5; --in:#6db3f2; --out:#f0a35e; --mech:#b3a79b;
  --w-da:#93a5a1; --w-i2c:#6c9cf5; --w-spi:#e0b93a; --w-sv:#c9d3d0; --w-pwr:#f0774c;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --sunk:#1f2c2a; --fg:#e4eeeb; --muted:#93a5a1; --line:#2c3b38;
  --board:#14605a; --board-fg:#e6f4f1; --accent:#3cc2b3; --accent-fg:#06211e;
  --core:#3cc2b3; --smart:#b28cf5; --in:#6db3f2; --out:#f0a35e; --mech:#b3a79b;
  --w-da:#93a5a1; --w-i2c:#6c9cf5; --w-spi:#e0b93a; --w-sv:#c9d3d0; --w-pwr:#f0774c;
  color-scheme:dark }

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
h1{font-size:1.7rem;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:1.25rem;line-height:1.3;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:.76rem;margin:0;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.lede{color:var(--muted);max-width:65ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.facts b{color:var(--fg);font-weight:600}
header{display:flex;flex-direction:column;gap:10px}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:8px;align-self:flex-start;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:5px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.view{display:flex;flex-direction:column;gap:18px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.levels button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;text-align:left;display:flex;flex-direction:column;gap:1px}
.levels button small{color:var(--muted);font-size:.8rem}
.levels button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.levels .lvn{font-weight:600}

.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;display:inline-flex;gap:8px;align-items:center}
.pick .num{font-family:var(--f-mono);font-size:.76rem;min-width:24px;height:24px;border-radius:999px;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pick[aria-pressed="true"] .num{background:var(--accent-fg);color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{font-size:.86rem;color:var(--muted)}
.what{max-width:65ch}
.stem{font-size:.9rem;color:var(--muted);max-width:65ch}
.stem b{color:var(--fg);font-weight:600}

/* sơ đồ nối dây */
.dg{position:relative;display:flex;flex-direction:column;gap:2px;padding-block:8px}
.dg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:76px;background:var(--board);border-radius:8px}
.row{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;min-height:38px}
.bhead{position:relative;z-index:1;justify-self:center;color:var(--board-fg);font-family:var(--f-mono);font-size:.7rem;text-align:center;line-height:1.25;padding-block:4px}
.port{position:relative;z-index:1;justify-self:center;width:56px;text-align:center;font-family:var(--f-mono);font-size:.72rem;padding:3px 0;border-radius:4px;border:1px solid transparent}
.p-da{background:#f1f1ec;color:#1c2422}
.p-i2c{background:#2f6fe4;color:#ffffff}
.p-spi{background:#e2b714;color:#1c2422}
.p-sv{background:#1c2422;color:#f1f1ec;border-color:#6f7d7a}
.p-pwr{background:#c9451a;color:#ffffff}
.p-on{background:transparent;color:#e6f4f1;border-color:#8fb8b2}
.run{display:flex;flex-wrap:wrap;align-items:center;row-gap:6px;min-width:0;padding-block:3px}
.w{flex:0 0 20px;height:2px;background:var(--wc,var(--w-da))}
.wc-i2c{--wc:var(--w-i2c)} .wc-spi{--wc:var(--w-spi)} .wc-sv{--wc:var(--w-sv)} .wc-pwr{--wc:var(--w-pwr)} .wc-da{--wc:var(--w-da)}
.row.off .port{opacity:.4}
.row.off{min-height:28px}
.empty{font-size:.8rem;color:var(--muted);padding-left:12px}
.note{font-size:.86rem;padding:4px 10px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;display:inline-flex;align-items:baseline;gap:7px;text-align:left;max-width:100%}
.chip .code{font-family:var(--f-mono);font-size:.76rem;color:var(--tc);flex:none}
.chip .att{font-size:.8rem;color:var(--muted)}
.chip .cnt{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip:hover,.pick:hover,.levels button:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.t-core{--tc:var(--core)} .t-smart{--tc:var(--smart)} .t-in{--tc:var(--in)} .t-out{--tc:var(--out)} .t-mech{--tc:var(--mech)}
.chip.t-smart{border-color:var(--smart)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:3px;border-radius:2px;background:var(--wc)}
.legend .dot{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.extra{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem;color:var(--muted)}

.stage{position:relative;background:var(--sunk);border-radius:8px;overflow:hidden;aspect-ratio:16/10;max-height:460px;width:100%}
.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:1.1rem;line-height:1}
.mode{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 56px)}
.mode button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:.8rem;line-height:1.2}
.mode button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.hint{font-size:.8rem;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.shots figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.shots a{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:4/3}
.shots img{width:100%;height:100%;object-fit:contain;display:block}
.shots figcaption{font-size:.8rem;color:var(--muted)}
.stage .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:.9rem}
.badge{display:inline-block;font-size:.74rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tc)}
.group{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{padding:0;border-bottom:1px solid var(--line)}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{position:sticky;top:0;background:var(--surface)}
th.mh{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:400;white-space:nowrap;border-right:1px solid var(--line)}
th.mh button{border:0;background:transparent;padding:5px 12px;display:flex;gap:8px;align-items:baseline;width:100%;text-align:left}
th.mh .code{font-family:var(--f-mono);font-size:.74rem;color:var(--tc);min-width:22px}
thead th button{border:0;background:transparent;width:30px;height:30px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
thead th.lvstart, td.lvstart{border-left:1px solid var(--line)}
td{width:30px;height:28px;text-align:center}
td i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tc)}
tr:hover td, tr:hover th.mh{background:var(--sunk)}
.corner{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);text-align:left;padding:0 12px;font-weight:500;color:var(--muted);font-size:.78rem}
@media (max-width:520px){ h1{font-size:1.4rem} .panel{padding:16px 14px} .dg::before{width:64px} .row{grid-template-columns:64px minmax(0,1fr)} .port{width:48px} .w{flex-basis:12px} }
@media (prefers-reduced-motion:no-preference){ .chip,.pick,.levels button{transition:border-color .12s} }
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>Bản đồ kit STEM ESP32-S3</h1>
    <p class="lede">Chọn một dự án để xem nó làm gì và cắm những module nào vào cổng nào của bo chủ. Chọn một module để xem nó xuất hiện trong những dự án nào.</p>
    <div class="facts" id="facts"></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Chế độ xem">
    <button role="tab" id="tab-proj" data-tab="proj" aria-selected="true">Dự án</button>
    <button role="tab" id="tab-mod" data-tab="mod" aria-selected="false">Module</button>
    <button role="tab" id="tab-mat" data-tab="mat" aria-selected="false">Bảng tổng hợp</button>
  </div>

  <section class="view" id="v-proj">
    <div class="levels" id="levels"></div>
    <div class="picks" id="picks"></div>
    <article class="panel" id="pdetail"></article>
  </section>

  <section class="view" id="v-mod" hidden>
    <article class="panel" id="mdetail"></article>
    <div id="mlist" class="view"></div>
  </section>

  <section class="view" id="v-mat" hidden>
    <p class="lede">Mỗi chấm là một module được dùng trong dự án ở cột đó. Bấm số dự án hoặc tên module để xem chi tiết.</p>
    <div class="scroll" id="matrix"></div>
    <div class="legend" id="tlegend"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TYPES = {core:'Trung tâm', smart:'Module thông minh tự thiết kế', in:'Đầu vào', out:'Đầu ra', mech:'Cơ khí'};
const M = {
  C1:{n:'Bo chủ ESP32-S3', t:'core', port:'Máy tính qua USB-C hoặc Bluetooth', d:'Bộ não của kit, chạy chương trình MicroBlocks. Có sẵn 2 nút bấm, còi, LED RGB, WiFi và Bluetooth; 6 cổng D/A, 2 bus I2C (thường và tốc độ cao), cổng SPI và 2 cổng servo.'},
  C2:{n:'Nguồn pin 2S', t:'core', port:'5 V vào bo chủ, 7,4 V sang module động lực, I2C để đọc pin', d:'Hai cell 18650 có mạch bảo vệ. Cấp 5 V cho bo chủ và 7,4 V cho động cơ; đo được phần trăm pin và dòng tiêu thụ.'},

  O1:{n:'LED đôi', t:'out', port:'Cổng D/A', d:'Hai đèn LED trên một module.'},
  O2:{n:'Thanh NeoPixel 8 LED', t:'out', port:'Cổng D/A', d:'Tám đèn đổi màu tùy ý, làm đèn báo và hiệu ứng.'},
  O3:{n:'Màn hình OLED', t:'out', port:'I2C', d:'Màn hình nhỏ hiện chữ, số và đồ thị.'},
  O4:{n:'Relay', t:'out', port:'Cổng D/A', d:'Công tắc điện tử đóng cắt tải điện áp thấp như đèn 12 V.'},
  O5:{n:'MOSFET + quạt/bơm', t:'out', port:'Cổng D/A (PWM)', d:'Điều khiển tốc độ quạt hoặc bơm nước mini.'},
  O6:{n:'Servo', t:'out', port:'Cổng servo, hoặc qua O7', d:'Động cơ quay tới góc chỉ định, làm cửa, tay gạt, khớp tay robot.'},
  O7:{n:'Bộ điều khiển 16 servo', t:'out', port:'I2C; nguồn từ C2', d:'Điều khiển nhiều servo cùng lúc với nguồn riêng, dùng cho cánh tay robot.'},
  K1:{n:'Cụm truyền động', t:'mech', port:'Cắm vào cổng động cơ của S1', d:'Hai động cơ encoder kèm gá và bánh xe; có bản N20 và bản JGA25-370.'},
  K2:{n:'Khung xe đa năng', t:'mech', port:'Bắt vít theo lưới 8 mm', d:'Lắp ngang thành xe dò line, lắp đứng thành xe cân bằng.'},
  K3:{n:'Mô hình nhà', t:'mech', port:'Bắt vít theo lưới 8 mm', d:'Nhà cắt laser có sẵn lỗ gá module.'},
  K4:{n:'Phụ kiện', t:'mech', port:'Tùy dự án', d:'Sa bàn vạch, thẻ RFID, khung cánh tay robot, băng tải mini.'}
};
const LV = [
  {n:'Làm quen', age:'12–13 tuổi', s:'8 buổi'},
  {n:'Nhà thông minh', age:'12–15 tuổi', s:'10 buổi'},
  {n:'Robot di động', age:'13–16 tuổi', s:'12 buổi'},
  {n:'IoT', age:'14–17 tuổi', s:'8 buổi'},
  {n:'Nâng cao', age:'16–18 tuổi', s:'10 buổi'}
];
const ATT = {S1:'+ 2 động cơ encoder', O7:'+ 4 servo'};
const PHONE = 'MQTT tới bảng điều khiển trên điện thoại';
const P = [
  {id:1, lv:0, n:'Đèn giao thông', pw:'usb', d:'Ba đèn đỏ, vàng, xanh đổi theo chu kỳ; bấm nút để người đi bộ xin qua đường.', stem:'mạch điện, lệnh tuần tự, thời gian', c:{A1:'I1', D1:'O1', D2:'O2'}},
  {id:2, lv:0, n:'Đàn điện tử', pw:'usb', d:'Mỗi nút là một nốt nhạc, xoay biến trở để đổi cao độ; còi trên bo chủ phát âm.', stem:'tần số âm thanh, biến, vòng lặp', c:{A1:'I2', D1:'I1'}, on:['Còi']},

const modsOf = p => {
  const s = new Set(['C1']);
  if (p.pw === 'bat') s.add('C2');
  Object.values(p.c).forEach(v => [].concat(v).forEach(m => s.add(m)));
  (p.extra || []).forEach(m => s.add(m));
  (p.k || []).forEach(m => s.add(m));
  return s;
};

const $ = id => document.getElementById(id);

const chip = (m, att, pressed) =>
  `<button class="chip t-${M[m].t}" data-mod="${m}"${pressed ? ' aria-pressed="true"' : ''}><span class="code">${m}</span><span>${M[m].n}</span>${att ? `<span class="att">${att}</span>` : ''}</button>`;
const pick = (p, pressed) =>
  `<button class="pick" data-proj="${p.id}" aria-pressed="${pressed}"><span class="num">${p.id}</span>${p.n}</button>`;

function row(label, pcls, wcls, items) {
  if (!items.length) return `<div class="row off"><span class="port ${pcls}">${label}</span><span class="empty">trống</span></div>`;
  return `<div class="row"><span class="port ${pcls}">${label}</span><div class="run ${wcls}">${items.map(h => `<span class="w"></span>${h}`).join('')}</div></div>`;
}

function renderProject() {
  const p = P.find(x => x.id === state.proj), lv = LV[p.lv], c = p.c;
  const att = m => (p.att && p.att[m]) || ATT[m];

  let rows = `<div class="row"><span class="bhead">C1<br>BO CHỦ</span><span></span></div>`;
  rows += row('NGUỒN', 'p-pwr', 'wc-pwr', [p.pw === 'bat' ? chip('C2', c.I2C && c.I2C.includes('S1') ? '7,4 V sang S1' : (c.I2C && c.I2C.includes('O7') ? '7,4 V sang O7' : '')) : `<span class="note">${PW[p.pw]}</span>`]);
  DA.forEach(k => rows += row(k, 'p-da', 'wc-da', one(c[k])));
  rows += row('I2C', 'p-i2c', 'wc-i2c', (c.I2C || []).map(m => chip(m, att(m))));
  rows += row('SPI', 'p-spi', 'wc-spi', one(c.SPI));
  rows += row('SERVO', 'p-sv', 'wc-sv', (c.SV || []).map(m => chip(m)));
  rows += row('TRÊN BO', 'p-on', 'wc-da', (p.on || []).map(t => `<span class="note">${t}</span>`));
  rows += row('WIFI', 'p-on', 'wc-da', p.wifi ? [`<span class="note">${p.wifi}</span>`] : []);
  const count = [...modsOf(p)].filter(m => M[m].t !== 'mech').length;
  $('pdetail').innerHTML = `
    <div class="group">
      <h2>${p.id} · ${p.n}</h2>
      <p class="meta">Cấp ${p.lv + 1}: ${lv.n} · ${lv.age}${p.open ? '' : ` · ${count} module điện tử`}</p>
    </div>
    <p class="what">${p.d}</p>
    <p class="stem"><b>Kiến thức STEM:</b> ${p.stem}</p>
    ${p.open ? '<p class="note">Không có sơ đồ cố định. Học sinh chọn module ở tab Module và tự thiết kế cách nối.</p>' : `
    ${window.THREE ? `<div class="group" id="g3d"><h3>Mô hình 3D</h3>
      <div class="stage" id="stage"><div class="mode"><button data-view3d="cad" aria-pressed="${view3d === 'cad'}">Mô hình CAD</button><button data-view3d="so" aria-pressed="${view3d === 'so'}">Sơ đồ khối</button></div><div class="zoom"><button data-zoom="0.85" aria-label="Phóng to">+</button><button data-zoom="1.18" aria-label="Thu nhỏ">−</button></div></div>
      <p class="hint">Kéo để xoay, bấm + hoặc − để phóng to, thu nhỏ. «Mô hình CAD» là bản thiết kế cơ khí đúng tỉ lệ, ở cấu hình đầy đủ của nhóm dự án. «Sơ đồ khối» chỉ gồm các module của riêng dự án này, kèm nhãn mã module như trong sơ đồ nối bên dưới.</p></div>` : ''}
    <div class="group"><h3>Sơ đồ nối</h3><div class="dg">${rows}</div></div>
    ${p.k ? `<div class="extra"><span>Cơ khí:</span>${p.k.map(m => chip(m)).join('')}</div>` : ''}
    <div class="legend">
      <span class="wc-da"><i></i>Cổng D/A</span><span class="wc-i2c"><i></i>I2C, nối chuỗi</span>
      <span class="wc-spi"><i></i>SPI</span><span class="wc-sv"><i></i>Servo</span><span class="wc-pwr"><i></i>Nguồn</span>
    </div>`}`;
  if (!p.open) mount3d(p);
}

function renderProjTab() {
  $('levels').innerHTML = LV.map((l, i) =>

  $('picks').innerHTML = P.filter(p => p.lv === state.lv).map(p => pick(p, p.id === state.proj)).join('');
  renderProject();
}

  $('mdetail').innerHTML = `

      <figure><a href="${hinh(m + '-pcb')}" target="_blank" rel="noopener"><img src="${hinh(m + '-pcb')}" alt="Mạch in ${m}, mặt trên" loading="lazy"></a><figcaption>Mạch in, mặt trên.</figcaption></figure>

    ${byLv.map(g => `<div class="group"><h3>Cấp ${g.i + 1} · ${g.l.n}</h3><div class="picks">${g.ps.map(p => pick(p, false)).join('')}</div></div>`).join('')}`;
  $('mlist').innerHTML = Object.keys(TYPES).map(t =>

  // hình nào chưa có thì ẩn ô đó; không còn hình nào thì ẩn cả nhóm
  document.querySelectorAll('#gshots img').forEach(im => im.addEventListener('error', () => {
    im.closest('figure').remove();

function renderMatrix() {
  const start = id => { const p = P.find(x => x.id === id), i = P.indexOf(p); return i === 0 || P[i - 1].lv !== p.lv ? ' lvstart' : ''; };
  $('matrix').innerHTML = `<table><thead><tr><th class="corner">Module \\ Dự án</th>${P.map(p =>
      `<th class="${start(p.id).trim()}"><button data-proj="${p.id}" title="${p.n}" aria-label="Dự án ${p.id}: ${p.n}">${p.id}</button></th>`).join('')}</tr></thead><tbody>${
    Object.keys(M).map(m => `<tr class="t-${M[m].t}"><th class="mh"><button data-mod="${m}"><span class="code">${m}</span>${M[m].n}</button></th>${P.map(p =>
      `<td class="${start(p.id).trim()}">${USES[m].includes(p.id) ? '<i></i>' : ''}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  $('tlegend').innerHTML = Object.keys(TYPES).map(t => `<span class="t-${t}"><span class="dot"></span>${TYPES[t]}</span>`).join('');
}

function render() {
  ['proj', 'mod', 'mat'].forEach(t => {
    $('v-' + t).hidden = state.tab !== t;
    $('tab-' + t).setAttribute('aria-selected', state.tab === t);
  });
  if (state.tab !== 'proj') $('pdetail').innerHTML = '';      // hai tab dùng chung một khung 3D (#stage)
  if (state.tab !== 'mod') $('mdetail').innerHTML = '';
  if (state.tab === 'proj') renderProjTab();
  else if (state.tab === 'mod') renderModTab();
  else renderMatrix();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.zoom) { zoom3d(+d.zoom); return; }
  if (d.view3d) {
    view3d = d.view3d;
    document.querySelectorAll('[data-view3d]').forEach(x => x.setAttribute('aria-pressed', x.dataset.view3d === view3d));
    if (R3 && cur3d) build3d(cur3d);
    return;
  }
  if (d.tab) state.tab = d.tab;
  else if (d.lv !== undefined) { state.lv = +d.lv; state.proj = P.find(p => p.lv === state.lv).id; }
  else if (d.proj) { state.proj = +d.proj; state.lv = P.find(p => p.id === state.proj).lv; state.tab = 'proj'; }
  else if (d.mod) { state.mod = d.mod; state.tab = 'mod'; }
  else return;
  render();
  if (d.proj || d.mod) document.querySelector('.tabs').scrollIntoView({block:'start', behavior:'auto'});
});

/* ---------- Mô hình 3D ---------- */
const T3 = {core:0x14605a, smart:0x7a3fd1, in:0x2b7fd0, out:0xd9731e, mech:0x8a8178};
const SIZE = {C1:[8,6], C2:[7,4], S1:[5,4], S2:[9,1.6], O7:[6,3], I13:[4,6], I4:[4,4], O2:[6,1.2], O3:[3,3]};
const PI = Math.PI;
let R3 = null, G = null, sway = null, az = .75, el = .5, dist = 62, auto = true, ty = 4, view3d = 'cad', cur3d = null;
const v = (x, y, z) => new THREE.Vector3(x, y, z);
const mat = c => new THREE.MeshLambertMaterial({color:c});
const glow = c => new THREE.MeshLambertMaterial({color:c, emissive:c, emissiveIntensity:.75});
function add(geo, c, x, y, z, p) { const m = new THREE.Mesh(geo, c.isMaterial ? c : mat(c)); m.position.set(x, y, z); (p || G).add(m); return m; }
const box = (w, h, d, c, x, y, z, p) => add(new THREE.BoxGeometry(w, h, d), c, x, y, z, p);
const cyl = (r, h, c, x, y, z, p, rt) => add(new THREE.CylinderGeometry(rt === undefined ? r : rt, r, h, 24), c, x, y, z, p);
const ball = (r, c, x, y, z, p) => add(new THREE.SphereGeometry(r, 18, 12), c, x, y, z, p);
const lay = m => { m.rotation.x = PI / 2; return m; };
function rod(a, b, r, c, p) {
  const d = v(0, 0, 0).subVectors(b, a), m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mat(c));
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(v(0, 1, 0), d.clone().normalize());
  (p || G).add(m); return m;
}
const ground = (w, d, c) => box(w, .5, d, c || 0xdfe4e2, 0, -.25, 0);

function label(code, x, y, z, p) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 64;

const dangNap = {};

function b64(str, T) {

  const k = 46 / Math.max(sz.x, sz.z, sz.y * 1.5), w = new THREE.Group();      // mô hình cao cũng phải nằm gọn trong khung

  ty = Math.min(16, sz.y * k / 2); dist = 72;
}
function don3d() {
  if (G) {
    G.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
    R3.scene.remove(G);
  }
  G = new THREE.Group(); sway = null; R3.scene.add(G);
}
function buildMod(q) {
  cur3d = q; don3d();
  nap(q.mod, ok => { if (cur3d === q && ok) { don3d(); cad(q.mod); dist = 96; hienKt(q.mod); } });
}
/* Kích thước bao lấy từ chính tệp mô hình, nên luôn khớp với tệp 3D đang hiển thị. */
function hienKt(m) {
  const d = window.MO_HINH && MO_HINH[m], o = $('kt');
  if (!o || !d || !d.kt) return;
  o.textContent = d.kt.map(x => String(x).replace('.', ',')).join(' × ') + ' mm';
  document.querySelectorAll('.ktd').forEach(e => e.hidden = false);
}

function build3d(p) {
  if (p.mod) return buildMod(p);
  cur3d = p; ty = 4;
  don3d();
  const id = p.id; let f = bench, dd = 64;
  if (id >= 5 && id <= 10) { f = house; dd = 78; }
  else if (id >= 11 && id <= 16) { f = car; dd = 76; }
  else if (id === 18) { f = garden; dd = 68; }
  else if (id === 21 || id === 22) { f = balance; dd = 60; }
  else if (id === 23) { f = arm; dd = 68; }
  else if (id === 24) { f = conveyor; dd = 76; }
  const cn = cadName(id);
  if (view3d === 'cad' && window.MO_HINH && MO_HINH[cn]) { cad(cn); return; }
  dist = dd; f(p);                      // sơ đồ khối hiện ngay; mô hình CAD thay vào khi nạp xong
  if (view3d === 'cad') nap(cn, ok => { if (ok && cur3d === p && view3d === 'cad') build3d(p); });
}

function init3d() {
  const cv = document.createElement('canvas'); cv.setAttribute('aria-label', 'Mô hình 3D của dự án');
  const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(32, 1.6, 1, 500);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa5a2, .95));
  const dl = new THREE.DirectionalLight(0xffffff, .55); dl.position.set(20, 40, 25); scene.add(dl);
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; auto = false; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    az -= (e.clientX - drag[0]) * .008;
    el = Math.min(1.35, Math.max(.1, el + (e.clientY - drag[1]) * .006));
    drag = [e.clientX, e.clientY];
  });
  const end = () => { drag = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  function size() {
    const s = cv.parentElement; if (!s) return;
    const w = s.clientWidth, h = s.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
  }
  const ro = new ResizeObserver(size);
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function tick(t) {
    requestAnimationFrame(tick);
    if (!cv.isConnected || state.tab === 'mat' || document.hidden) return;
    if (auto && !still) az += .0025;
    if (sway && !still) sway.rotation.z = Math.sin((t || 0) / 700) * .05;
    const c = Math.cos(el);
    cam.position.set(Math.sin(az) * c * dist, Math.sin(el) * dist + ty, Math.cos(az) * c * dist);
    cam.lookAt(0, ty, 0);
    renderer.render(scene, cam);
  })(0);
  R3 = {cv, scene, ro, size};
}

function mount3d(p) {
  const st = $('stage'); if (!st || !window.THREE) return;
  try { if (!R3) init3d(); } catch (e) { $('g3d').hidden = true; return; }
  R3.ro.disconnect(); st.prepend(R3.cv); R3.ro.observe(st);
  build3d(p); R3.size();
}
function zoom3d(k) { dist = Math.min(150, Math.max(28, dist * k)); }

const elec = Object.keys(M).filter(m => M[m].t !== 'mech').length;
$('facts').innerHTML = `<span><b>${P.length}</b> dự án</span><span><b>${LV.length}</b> cấp độ</span><span><b>${elec}</b> module điện tử</span><span><b>3</b> module thông minh tự thiết kế</span><span>Học sinh <b>12–18</b> tuổi</span><span>Lập trình kéo thả <b>MicroBlocks</b></span>`;
render();
/* Nạp danh sách mô hình sau khi trang đã hiện rồi vẽ lại; từng mô hình chỉ được nạp khi cần xem. */
(() => {
  const sc = document.createElement('script'); sc.src = 'mo-hinh/danh-sach.js?t=' + Date.now(); sc.async = true;
  sc.onload = () => render();
  document.head.appendChild(sc);
})();
</script>
